name: Daily scrape

on:
  schedule:
    # 00:00 UTC = 07:00 Asia/Bangkok (UTC+7). GitHub's cron can run a few
    # minutes late during high load — that's normal, not a failure.
    - cron: "0 0 * * *"
  workflow_dispatch: {} # lets us trigger a run manually from the Actions tab to test

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one module failing shouldn't cancel the others
      # dynamicair.co.th consistently rejects connections from GitHub's
      # runner IP range (times out; works fine from a normal residential/
      # office connection) — that module runs from the office PC's Task
      # Scheduler instead. See .claude/task-scheduler-dynamicair.md.
      matrix:
        module: [karshine, ecoair, cooltech, wise, wizard, news]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ${{ matrix.module }} module
        run: python scripts/run_module.py ${{ matrix.module }}

  notify:
    needs: scrape
    if: always() # send the summary whether every module passed or some failed
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # built-in, no setup needed — just reads this run's own job results
    steps:
      - uses: actions/checkout@v4

      - name: Build and send Telegram summary
        run: |
          # Pull this run's per-module job results straight from the
          # Actions API — the matrix job's own `needs.scrape.result` only
          # says "did anything fail", not which module. See
          # scripts/notify_summary.py for how the message is built.
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SUMMARY=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" | python3 scripts/notify_summary.py)
          MESSAGE="$SUMMARY

          $RUN_URL"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="$MESSAGE"
